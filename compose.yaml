services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: circuitguard
      POSTGRES_USER: circuitguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuitguard -d circuitguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://circuitguard:${POSTGRES_PASSWORD}@database:5432/circuitguard
      DATABASE_SSL: "false"
      COOKIE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FRONTEND_ORIGIN: http://localhost:8080
      DRC_ENGINE_URL: http://drc-engine:8000
      DRC_ENGINE_TIMEOUT_MS: 120000
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      drc-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  drc-engine:
    build: ./backend-fastapi
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    init: true
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
